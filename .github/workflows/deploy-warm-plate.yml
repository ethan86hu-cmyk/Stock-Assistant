name: Deploy Warm Plate

# Runs when warm-plate changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["warm-plate/**", ".github/workflows/deploy-warm-plate.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行测试
        working-directory: warm-plate
        run: |
          npm ci
          npm test
          # Dependencies are installed on the server; don't upload these.
          rm -rf node_modules

      # Copy the code to the server; the server needs no GitHub access.
      # .env and data/ on the server are left untouched.
      - name: 上传代码到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "warm-plate"
          target: ${{ secrets.WARM_PLATE_PATH }}
          strip_components: 1

      - name: 安装依赖并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.WARM_PLATE_PATH }}
            npm ci --omit=dev --registry=https://registry.npmmirror.com
            sudo systemctl restart warm-plate
            sleep 2
            curl -fsS http://127.0.0.1:3100/api/config > /dev/null
            echo "Warm Plate 部署完成：$(date)"
