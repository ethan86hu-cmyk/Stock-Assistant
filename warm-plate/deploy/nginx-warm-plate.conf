# nginx site for Warm Plate. Replace warm.example.com with your domain.
# Install: sudo cp deploy/nginx-warm-plate.conf /etc/nginx/conf.d/warm-plate.conf
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name warm.example.com;
    return 301 https://$host$request_uri;
}

server {
    # "listen 443 ssl http2" works on older nginx too (1.25+ prints a harmless warning).
    listen 443 ssl http2;
    server_name warm.example.com;

    # Point these at your certificate (Aliyun free certificate or certbot).
    ssl_certificate     /etc/nginx/ssl/warm.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/warm.example.com.key;

    # Photos are resized in the browser, but leave headroom.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Image recognition can take a while.
        proxy_read_timeout 120s;
    }
}
