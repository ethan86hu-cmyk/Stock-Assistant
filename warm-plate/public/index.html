<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page has its own Chinese version; stop browsers from auto-translating it. -->
  <meta name="google" content="notranslate">
  <title>Warm Plate</title>
  <meta name="description" content="Snap your meal and see if it's warming or cooling, the way a Chinese grandma would.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b5452f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23faf6f0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1><span data-i18n="title"></span> <span class="zh">暖盘</span></h1>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </div>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <p id="demo-banner" class="banner" data-i18n="demo" hidden></p>

    <section class="card" id="term-card" hidden>
      <div class="term-name"><span id="term-zh"></span> <span id="term-en"></span></div>
      <p id="term-tip"></p>
    </section>

    <section class="card">
      <h2 data-i18n="bodyQuestion"></h2>
      <div id="constitutions" class="chips" role="radiogroup"></div>
    </section>

    <section class="card">
      <label class="upload" for="photo">
        <input id="photo" type="file" accept="image/*" capture="environment">
        <span data-i18n="upload"></span>
      </label>
      <img id="preview" alt="" hidden>
      <p id="status" role="status"></p>
    </section>

    <section id="result" hidden>
      <div class="card">
        <div class="verdict">
          <div class="score" id="score"></div>
          <div>
            <div class="plate-nature" id="plate-nature"></div>
            <div class="headline" id="headline"></div>
          </div>
        </div>
        <div class="gauge" aria-hidden="true">
          <div class="gauge-bar"></div>
          <div class="gauge-marker target" id="target-marker"></div>
          <div class="gauge-marker plate" id="plate-marker"></div>
        </div>
        <div class="gauge-labels">
          <span data-i18n="scaleCold"></span><span data-i18n="scaleNeutral"></span><span data-i18n="scaleHot"></span>
        </div>
        <p class="gauge-legend">
          <span class="dot plate"></span> <span data-i18n="legendMeal"></span>
          <span class="dot target"></span> <span data-i18n="legendIdeal"></span>
        </p>
        <p class="target-reason" id="target-reason"></p>
      </div>

      <div class="card grandma">
        <p class="quote" id="grandma"></p>
        <ul id="suggestions"></ul>
      </div>

      <div class="card">
        <h2 data-i18n="plateHeading"></h2>
        <ul id="items" class="items"></ul>
      </div>
    </section>

    <footer data-i18n="disclaimer"></footer>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
